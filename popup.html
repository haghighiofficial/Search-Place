<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Place</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="icons/popup_logo.png" class="logo-icon" width="22" height="22" alt="Search Place Logo">
        <span class="brand-title">Search Place</span>
      </div>
      <div id="activeLocationBadge" class="location-badge" title="Active Canonical Location">Select location</div>
    </header>

    <!-- Favorites / Quick Presets -->
    <div class="presets-section">
      <div class="presets-header">
        <span class="presets-label">Favorites</span>
        <button type="button" id="addFavoriteBtn" class="star-btn" title="Save current location as favorite">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true">
            <path d="M8 12.16l-3.8 2.3.99-4.32L1.8 7.32l4.43-.37L8 2.85l1.77 4.1 4.43.37-3.39 2.82.99 4.32L8 12.16z"/>
          </svg>
          <span>Save</span>
        </button>
      </div>
      <div id="favoritesList" class="favorites-pills">
        <!-- Dynamically rendered pills -->
      </div>
    </div>

    <!-- Main Form -->
    <main class="main-content">
      <!-- Query Field -->
      <div class="input-group">
        <label for="queryInput" class="input-label">Search Query</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="queryInput" 
            class="text-input" 
            placeholder="Enter query to search locally..." 
            autocomplete="off" 
            spellcheck="false"
            autofocus
          />
        </div>
      </div>

      <!-- Location Pickers: Country, City & Region Dropdowns -->
      <div class="input-group">
        <label class="input-label">Target Location</label>
        <div class="dropdowns-row">
          <div class="select-wrapper">
            <select id="countrySelect" class="select-input" title="Select Country">
              <!-- Country options populated via JS -->
            </select>
          </div>
          <div class="select-wrapper">
            <select id="citySelect" class="select-input" title="Select City">
              <!-- City options populated via JS -->
            </select>
          </div>
        </div>
        <!-- Region / District Dropdown -->
        <div class="select-wrapper region-wrapper">
          <select id="regionSelect" class="select-input" title="Select District / Region">
            <!-- Region / District options populated via JS -->
          </select>
        </div>
        <!-- Custom Region Input (appears when Custom District is selected) -->
        <div id="customRegionRow" class="custom-region-row hidden">
          <input 
            type="text" 
            id="customRegionInput" 
            class="text-input custom-region-input" 
            placeholder="Enter custom district / area name (e.g. Vanak)..." 
            autocomplete="off" 
            spellcheck="false"
          />
        </div>
      </div>

      <!-- Quick Autocomplete / Custom Location Input -->
      <div class="input-group">
        <div class="autocomplete-wrapper">
          <input 
            type="text" 
            id="citySearchInput" 
            class="text-input search-city-input" 
            placeholder="Type to filter or enter custom location..." 
            autocomplete="off" 
            spellcheck="false"
          />
          <button type="button" id="clearSearchBtn" class="clear-btn hidden" title="Clear location search">&times;</button>
          <div id="autocompleteDropdown" class="autocomplete-dropdown hidden">
            <!-- Autocomplete items rendered dynamically -->
          </div>
        </div>
      </div>

      <!-- Preview Details Card -->
      <div class="preview-card">
        <div class="preview-row">
          <span class="preview-label">Canonical:</span>
          <span id="previewCanonical" class="preview-value text-ellipsis" title="">-</span>
        </div>
        <div class="preview-row">
          <span class="preview-label">Country (gl):</span>
          <span id="previewCountryCode" class="preview-value badge-gl">-</span>
        </div>
        <div class="preview-row">
          <span class="preview-label">UULE Code:</span>
          <span id="previewUule" class="preview-value uule-mono text-ellipsis" title="Click to copy">-</span>
        </div>
      </div>

      <!-- Primary Action Buttons -->
      <div class="actions-group">
        <button type="button" id="searchGoogleBtn" class="primary-btn">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
          </svg>
          <span>Search on Google</span>
        </button>

        <button type="button" id="copyUrlBtn" class="secondary-btn" title="Copy localized Google search link">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true">
            <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
            <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
          </svg>
          <span id="copyBtnText">Copy URL</span>
        </button>
      </div>
    </main>

    <!-- Footer Attribution -->
    <footer class="footer">
      <a 
        href="https://www.linkedin.com/in/haghighiofficial/" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="linkedin-link" 
        aria-label="Majid Haghighi on LinkedIn" 
        title="Majid Haghighi on LinkedIn">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M0 1.146C0 .513.526 0 1.175 0h13.65C15.474 0 16 .513 16 1.146v13.708c0 .633-.526 1.146-1.175 1.146H1.175C.526 16 0 15.487 0 14.854V1.146zm4.943 12.248V6.169H2.542v7.225h2.401zm-1.2-8.212c.837 0 1.358-.554 1.358-1.248-.015-.709-.52-1.248-1.342-1.248-.822 0-1.359.54-1.359 1.248 0 .694.521 1.248 1.327 1.248h.016zm4.908 8.212V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-.878.869 0 1.216.662 1.216 1.634v3.865h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016l.016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225h2.4z"/>
        </svg>
      </a>
    </footer>
  </div>

  <script src="data/locations.js"></script>
  <script src="popup.js"></script>
</body>
</html>
